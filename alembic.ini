# alembic.ini — Alembic configuration for the Knowledge Assistant.
# This file is safe to commit. No secrets are stored here.

[alembic]
# Relative path to the migrations directory
script_location = alembic

# Logging format
prepend_sys_path = .

# Database URL is read from the environment variable in env.py,
# so this value is a placeholder.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
