name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel previous runs if new commits are pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: "testing"
      GEMINI_API_KEY: "ci_dummy_gemini_api_key_for_testing_1234567890"
      JWT_SECRET_KEY: "ci_dummy_jwt_secret_key_must_be_at_least_32_chars_long"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      CHROMA_PERSIST_DIR: "./chroma_test_store"
      UPLOAD_DIR: "./test_uploads"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
